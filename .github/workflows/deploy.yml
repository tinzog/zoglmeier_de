name: Deploy to netcup

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Never run two uploads to the same webspace at the same time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://zoglmeier.de/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Guard: without a target dir the action would upload into the FTP root.
      - name: Check target directory
        env:
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          if [ -z "$FTP_SERVER_DIR" ]; then
            echo "::error::Secret FTP_SERVER_DIR is not set." >&2
            exit 1
          fi

      # Uploads only changed files via FTPS (FTP over TLS). The action keeps a state file
      # (.ftp-deploy-sync-state.json) on the server and only deletes files it uploaded itself.
      - name: Upload via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
